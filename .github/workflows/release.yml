name: Release

on:
  workflow_dispatch:

run-name: Release requested by @${{ github.actor }}

permissions:
  contents: read

jobs:
  release:
    name: Release and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Create version tag and GitHub release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Require a merged release PR
        if: steps.release.outputs.release_created != 'true'
        run: |
          echo "::error::No merged Release Please PR is ready to release."
          exit 1

      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: "24.16.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release-quality checks
        run: pnpm run check

      - name: Publish with npm Trusted Publishing
        run: pnpm run publish:release
